name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test-lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Format check
        run: |
          ruff format --check .

      - name: Type check (mypy)
        run: |
          mypy src tests

      - name: Tests
        run: |
          pytest -q