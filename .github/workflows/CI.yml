name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  docker-quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the image once, reuse it for all checks
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: market-regime:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ruff (lint) in container
        run: docker run --rm market-regime:ci ruff

      - name: Ruff (format check) in container
        run: docker run --rm market-regime:ci sh -lc "ruff format --check ."

      - name: Mypy (type check) in container
        run: docker run --rm market-regime:ci sh -lc "mypy src tests"

      - name: Pytest in container
        run: docker run --rm market-regime:ci test
