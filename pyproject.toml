[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501", # formatter handles line length
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]

# Speed + stability: do not typecheck installed dependencies
ignore_missing_imports = true
follow_imports = "skip"

# Reasonable warnings
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true

exclude = [
  "^data/.*$",
  "^mlruns/.*$",
  "^models/.*$",
  "^registry/.*$",
  "^.*/__pycache__/.*$",
  "^.*/\\.pytest_cache/.*$",
  "^.*/\\.mypy_cache/.*$",
  "^.*/\\.ruff_cache/.*$",
  "^.*/\\.venv/.*$",
]