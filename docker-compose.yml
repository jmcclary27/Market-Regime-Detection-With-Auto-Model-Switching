services:
  market:
    build: .
    working_dir: /app
    user: "0:0"
    environment:
      S3_SYNC_ENABLED: ${S3_SYNC_ENABLED:-false}
      ARTIFACT_BUCKET: ${ARTIFACT_BUCKET:-}
      PROJECT_ROOT: /runtime
      DATA_DIR: /runtime/data
      PYTHONPATH: /app
      MLFLOW_TRACKING_URI: file:/runtime/mlruns
      RUFF_CACHE_DIR: /tmp/ruff_cache
      PYTEST_ADDOPTS: -o cache_dir=/tmp/pytest_cache
      MYPY_CACHE_DIR: /tmp/mypy_cache
    volumes:
      - market_runtime:/runtime

  dashboard:
    build: .
    working_dir: /app
    user: "0:0"
    command: ["dashboard"]
    environment:
      MARKET_REGIME_DASHBOARD_ROOT: /runtime
      PYTHONPATH: /app
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    ports:
      - "8501:8501"
    volumes:
      - market_runtime:/runtime

volumes:
  market_runtime:
