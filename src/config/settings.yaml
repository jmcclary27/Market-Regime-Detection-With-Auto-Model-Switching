market:
  symbols: ["SPY", "QQQ"]
  frequency: daily

data:
  raw_path: data/raw
  processed_path: data/processed
  features_path: data/features
  regimes_path: data/regimes

regimes:
  method: hmm
  hmm:
    artifacts_dir: models/regimes/hmm

experiment:
  enabled: false
  experiment_id: frozen-daily-spy-v1
  provider: alpaca
  symbols: ["SPY", "QQQ"]
  traded_symbol: SPY
  starting_cash: 100000.0
  fee_bps: 1.0
  slippage_bps: 2.0
  exposure_thresholds: [-0.001, 0.001]
  manifest_path: artifacts/experiment/manifest.json
  # This path is written only by the explicit readiness/freeze workflow.
  public_payload_path: data/experiment/public/latest.json

logging:
  level: INFO

live_sim:
  provider: yfinance
  interval: 5m
  poll_sleep_seconds: 300
  lookback_days: 60
  candle_close_buffer_seconds: 60
  stale_bar_tolerance_seconds: 600
  market_timezone: America/New_York
  market_open: "09:30"
  market_close: "16:00"
  regular_hours_only: true
  starting_cash: 100000.0
  dry_run: true
  lock_timeout_seconds: 900
  provider_failure_backoff_seconds: 300
  paths:
    raw_dir: data/raw/live_sim
    runs_dir: data/runs
    predictions_dir: data/predictions
    state_path: data/live_sim/account_state.json
    loop_state_path: data/live_sim/live_loop_state.json
    lock_path: data/live_sim/live_sim.lock
    heartbeat_path: data/live_sim/heartbeat.json
    trades_path: data/live_sim/trades.parquet
    equity_path: data/live_sim/equity_curve.parquet
