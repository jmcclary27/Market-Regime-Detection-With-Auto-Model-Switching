services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    env_file: .env.airflow
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command: -lc "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data:/opt/project/data
      - ./models:/opt/project/models

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    env_file: .env.airflow
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    command: webserver
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data:/opt/project/data
      - ./models:/opt/project/models

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    env_file: .env.airflow
    depends_on:
      postgres:
        condition: service_healthy
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data:/opt/project/data
      - ./models:/opt/project/models

volumes:
  airflow_pgdata:
